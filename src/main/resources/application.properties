spring.application.name=internet-speed-checker
server.port=${PORT:8080}

# ---- PostgreSQL (default) ----
# Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/speedchecker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates the speed_test_results table automatically (fine for learning; use Flyway/Liquibase in production).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Do not gzip the random download payload - it would distort measurements.
server.compression.enabled=false
